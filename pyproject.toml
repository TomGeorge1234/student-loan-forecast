[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "student-loan-forecaster"
version = "0.1.0"
description = "Interactive UK Plan 2 student-loan forecaster"
requires-python = ">=3.10"
dependencies = [
    "altair>=5,<7",
    "numpy>=2,<3",
    "streamlit>=1.40,<2",
]

[tool.poetry]
package-mode = false

[tool.setuptools]
py-modules = ["student_loan_gui"]
